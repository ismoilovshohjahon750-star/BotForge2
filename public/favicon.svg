<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0b1329" />
      <stop offset="100%" stopColor="#040711" />
    </linearGradient>

    <!-- Vibrant Neon Cloud/Bot Gradient -->
    <linearGradient id="fav-primary" x1="4" y1="8" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="45%" stopColor="#00f2fe" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>

    <linearGradient id="fav-visor-glow" x1="20" y1="24" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#031024" />
      <stop offset="100%" stopColor="#081a38" />
    </linearGradient>

    <!-- Filter Glow for Favicon -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#fav-bg)" stroke="url(#fav-primary)" stroke-width="2"/>

  <!-- Subtle Inner Ambient Mesh Glow -->
  <circle cx="32" cy="34" r="18" fill="#00f2fe" opacity="0.15" filter="url(#fav-glow)" />

  <!-- Signal Antenna -->
  <path d="M32 17 L32 9" stroke="url(#fav-primary)" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="8" r="3.5" fill="#00f2fe" filter="url(#fav-glow)" />
  <circle cx="32" cy="8" r="1.5" fill="#ffffff" />

  <!-- Cloud Robot Main Shell (Bold, solid & high contrast) -->
  <path
    d="M17 44 C11 44 7 37 10 30 C12 24 17 22 23 21 C25 13 35 10 43 14 C48 16 52 21 53 27 C59 28 63 33 61 40 C60 44 55 44 50 44 Z"
    fill="url(#fav-primary)"
  />

  <!-- Bot Screen Visor (Cutout Dark Glass) -->
  <rect x="18" y="27" width="28" height="13" rx="5" fill="url(#fav-visor-glow)" stroke="#00f2fe" stroke-width="1.2"/>

  <!-- High-Luminance Cyber Eyes (Vibrant White + Cyan Core) -->
  <rect x="22" y="30.5" width="6.5" height="6" rx="2" fill="#00f2fe" filter="url(#fav-glow)"/>
  <rect x="23.5" y="31.5" width="3.5" height="3" rx="1" fill="#ffffff"/>

  <rect x="35.5" y="30.5" width="6.5" height="6" rx="2" fill="#00f2fe" filter="url(#fav-glow)"/>
  <rect x="37" y="31.5" width="3.5" height="3" rx="1" fill="#ffffff"/>

  <!-- Cloud Server Connection Pulse Dots -->
  <circle cx="24" cy="51" r="2" fill="#10b981" opacity="0.9" />
  <circle cx="32" cy="53" r="2.5" fill="#00f2fe" filter="url(#fav-glow)" />
  <circle cx="40" cy="51" r="2" fill="#3b82f6" opacity="0.9" />
  <path d="M25 51 Q32 54 39 51" stroke="url(#fav-primary)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>

